# ============================================================
# Microblink BlinkID self-hosted — stack de PRODUCTION
# ============================================================
# Deploye par setup.sh (options D puis m) dans $KYC_MB_DIR (/opt/microblink).
#
# Deploiement par IMAGE : aucun code source n'est necessaire sur le serveur.
# Les deux images viennent de Docker Hub.
#
# Le fichier .env voisin est GENERE par setup.sh depuis les variables KYC_MB_*
# du .env de deploiement. Ne pas l'editer a la main : il serait ecrase.
# ============================================================

services:
  # ── Moteur Microblink ──────────────────────────────────────
  api:
    # Epingle par DIGEST de liste de manifestes, pas par tag.
    #
    # Ce digest est celui du tag 5.0 (= 5.0.1), la seule reference 5.0.x que
    # Microblink ait publiee pour les DEUX architectures : 5.0.0 n'existe qu'en
    # arm64 et 5.0.1 qu'en amd64. Avec 5.0.0 le conteneur ne demarre pas sur un
    # serveur amd64.
    #
    # C'est bien un digest de LISTE : docker y choisit encore amd64 ou arm64
    # selon l'hote. Epingler le digest d'une architecture precise casserait
    # l'autre.
    #
    # Le tag 5.0 bougera a la sortie de 5.0.2 ; ce digest, non.
    #
    # La variable porte la reference ENTIERE pour qu'un retour a un tag
    # (MB_ENGINE_IMAGE=microblink/api:5.1.0) ne demande pas d'editer ce fichier.
    image: ${MB_ENGINE_IMAGE:-microblink/api@sha256:3f24bc799ceec86b06e9395317e14e2b236c43f2c26ccc8cb0adffb32f85c5f5}
    env_file:
      - .env
    environment:
      # PORT est le port INTERNE au conteneur (HOST_PORT est celui de l'hote).
      PORT: ${PORT:-9080}

      # Resilience de la verification de licence.
      #
      # Defauts embarques dans l'image (application.yml du binaire) :
      #   sdkLock.serverCallWaitingTimeoutMs: 1000   -> 1 seule seconde
      #   sdkLock.baltazar.client.retryAttempts: 1   -> 1 seule tentative
      #   sdkLock.baltazar.client.retryInterval: 3s
      #
      # Contrairement a `ping.client`, `sdk-lock` n'a PAS de `retry-schedule` :
      # une fois les tentatives epuisees le SDK abandonne DEFINITIVEMENT et
      # toute reconnaissance renvoie "Invalid wrapper input" jusqu'au
      # redemarrage du conteneur. Une coupure Internet de quelques secondes
      # suffit a mettre le service hors service (constate le 2026-07-29).
      #
      # Ces proprietes ne sont pas exposees par /entrypoint.sh : elles passent
      # obligatoirement par JAVA_OPTS (variable officiellement documentee).
      JAVA_OPTS: >-
        -Dmicroblink.sdk-lock.baltazar.client.retry-attempts=${LICENCE_RETRY_ATTEMPTS:-10}
        -Dmicroblink.sdk-lock.baltazar.client.retry-interval=${LICENCE_RETRY_INTERVAL:-30s}
        -Dmicroblink.sdk-lock.server-call-waiting-timeout-ms=${LICENCE_CALL_TIMEOUT_MS:-15000}
    restart: unless-stopped
    volumes:
      # Ces deux montages ne sont PAS de la telemetrie optionnelle : la licence
      # identifie la machine par machine-id. Sans eux le ping echoue et la
      # reconnaissance s'arrete. (Sur Linux les deux chemins existent.)
      - /etc/machine-id:/etc/machine-id:ro
      - /var/lib/dbus/machine-id:/var/lib/dbus/machine-id:ro
    ports:
      - "${HOST_PORT:-9080}:${PORT:-9080}"
    healthcheck:
      # L'image ne contient ni curl ni wget -> /dev/tcp de bash.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/${PORT:-9080}; printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q ''"status":"UP"'' <&3'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Facade Go (format standard SENTINEL-KYC) ───────────────
  ocr-api:
    # Pas de section `build` ici, contrairement au depot de developpement :
    # en production on deploie strictement l'image publiee.
    image: digitalpi/sentinel-micro-blink-ocr-api:${API_VERSION:-latest}
    restart: unless-stopped
    environment:
      # Reseau interne du compose : nom de service + port INTERNE.
      MICROBLINK_URL: http://api:${PORT:-9080}
      MICROBLINK_USER: ${BASIC_AUTH_USERNAME:-}
      MICROBLINK_PASS: ${BASIC_AUTH_PASSWORD:-}
      API_PORT: "8000"
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      DEFAULT_AGE_LIMIT: ${DEFAULT_AGE_LIMIT:-18}
      REQUEST_TIMEOUT_S: ${REQUEST_TIMEOUT_S:-60}
      CONVERT_TARGET: ${CONVERT_TARGET:-jpeg}
      CONVERT_QUALITY: ${CONVERT_QUALITY:-95}
      CROPPED_RETRY: ${CROPPED_RETRY:-true}
    ports:
      - "${API_HOST_PORT:-9000}:8000"
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Maintien en vie de la licence ──────────────────────────
  # La licence LIC03000074559 exige une permission serveur periodique. Les trois
  # pannes constatees (2026-07-29, 2026-08-19) sont toutes survenues pendant des
  # periodes d'INACTIVITE, et un scan toutes les 60 s avait maintenu la licence
  # vivante 16 min d'affilee. L'inactivite est le meilleur suspect — non prouve,
  # mais ce service coute assez peu pour ne pas attendre la preuve.
  #
  # Une fois la licence perdue le SDK n'y revient JAMAIS seul : seul un
  # redemarrage du conteneur le recupere. Mieux vaut donc l'empecher de mourir
  # que d'essayer de la ressusciter.
  #
  # Le scan porte sur un PNG blanc de 432 octets genere au demarrage : aucune
  # piece d'identite ne circule, et la reponse attendue est un ECHEC structure
  # (STRUCT_NOT_AN_ID_CARD) — ce qui prouve que toute la chaine a tourne.
  keepalive:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      ocr-api:
        condition: service_started
    environment:
      # Intervalle entre deux pings, en secondes. 0 desactive le service sans
      # avoir a le retirer du compose.
      #
      # 900 s = 96 scans/jour/noeud, soit ~5 800/mois pour deux noeuds. A ajuster
      # selon le modele de facturation de la licence, qui n'est PAS documente ici :
      # si elle est au volume, ce chiffre compte ; si elle est forfaitaire, on peut
      # descendre a 300 s. Les pannes observees sont survenues apres des dizaines
      # de minutes d'inactivite, donc 900 s reste largement sous le seuil connu.
      KEEPALIVE_INTERVAL: ${KEEPALIVE_INTERVAL:-900}
      # 1 = une ligne par ping. A reserver au diagnostic : a 900 s cela fait
      # 96 lignes/jour, ce qui noie les anomalies.
      KEEPALIVE_VERBOSE: ${KEEPALIVE_VERBOSE:-0}
      # Bilan periodique, en nombre de pings. C'est la PREUVE DE VIE du service :
      # sans elle, un keepalive silencieux est indiscernable d'un keepalive mort.
      # 24 pings a 900 s = un bilan toutes les 6 h.
      KEEPALIVE_SUMMARY_EVERY: ${KEEPALIVE_SUMMARY_EVERY:-24}
      KEEPALIVE_URL: http://ocr-api:8000/v1/scan
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ "$${KEEPALIVE_INTERVAL:-900}" -le 0 ]; then
          echo "keepalive desactive (KEEPALIVE_INTERVAL=0)"
          # sleep infini plutot qu'un exit : un exit 0 avec restart:unless-stopped
          # ferait boucler le conteneur en redemarrages permanents.
          while true; do sleep 86400; done
        fi
        printf '%s' '' \
          | base64 -d > /tmp/ping.png
        echo "keepalive demarre — un scan toutes les $${KEEPALIVE_INTERVAL}s vers $${KEEPALIVE_URL}"
        # Laisse le temps a ocr-api de repondre : depends_on ne garantit que le
        # demarrage du conteneur, pas que le serveur HTTP ecoute deja.
        sleep 15
        n=0; ok=0; ko=0
        while true; do
          body=$(curl -s -m 60 -w '\n%{http_code}' -X POST "$$KEEPALIVE_URL" -F "file=@/tmp/ping.png" 2>/dev/null || true)
          code=$(printf '%s' "$$body" | tail -n1)
          n=$((n+1))
          case "$$code" in
            200) ok=$((ok+1))
                 [ "$${KEEPALIVE_VERBOSE:-0}" = "1" ] && echo "$(date -u +%FT%TZ) ping OK" || true ;;
            503) ko=$((ko+1)); echo "$(date -u +%FT%TZ) LICENCE PERDUE — le moteur ne reviendra pas seul, redemarrer le conteneur api" ;;
            ""|000) ko=$((ko+1)); echo "$(date -u +%FT%TZ) facade injoignable" ;;
            *)   ko=$((ko+1)); echo "$(date -u +%FT%TZ) reponse inattendue: HTTP $$code" ;;
          esac
          # Bilan periodique : sans lui, un service muet ne se distingue pas d'un
          # service mort. C'est la seule trace en fonctionnement nominal.
          if [ "$${KEEPALIVE_SUMMARY_EVERY:-24}" -gt 0 ] && [ $((n % $${KEEPALIVE_SUMMARY_EVERY:-24})) -eq 0 ]; then
            echo "$(date -u +%FT%TZ) bilan: $$n pings, $$ok ok, $$ko echecs, intervalle $${KEEPALIVE_INTERVAL}s"
          fi
          sleep "$$KEEPALIVE_INTERVAL"
        done
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
